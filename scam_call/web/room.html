<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamSquash Call Room</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f3ebff; color: #261738; font: 16px/1.5 "DM Sans", system-ui, sans-serif; }
main { width: min(700px, 94%); margin: 2rem auto; }
header, section { padding: 1.4rem; border-radius: 18px; margin-bottom: 1rem; }
header { background: #512488; color: white; }
h1, h2 { margin: 0 0 .6rem; }
section { background: white; }
button { font: inherit; padding: .6rem 1rem; margin: .2rem; border: 0; border-radius: 10px; }
#talk { background: #682fbe; color: white; }
button:disabled { opacity: .55; }
pre { white-space: pre-wrap; font: inherit; }
</style>
<main>
<header><h1>ScamSquash</h1><div id="role">Connecting…</div></header>
<section>
<p>Use fictional details. Tell both participants their speech will be transcribed.</p>
<button id="join">Enable microphone and audio</button>
<button id="talk" disabled>Record turn</button>
<button id="end" hidden>End call</button>
<p id="status" role="status"></p>
<audio id="audio" controls hidden></audio>
</section>
<section><h2>Transcript</h2><ol id="turns"></ol></section>
<section id="draft" hidden><h2>Incident draft</h2><pre id="report"></pre><button id="save">Download transcript</button></section>
</main>
<script>
const el = (id) => document.getElementById(id);
const token = location.hash.slice(1);
const headers = {Authorization: "Bearer " + token};
const talk = el("talk");
const player = el("audio");
let state, mic, recorder, timer;
let lastPlayed = 0;
let playing = false;
let pending = false;
let refreshing = false;

async function request(path, options = {}) {
  const response = await fetch(path, {...options, headers});
  const kind = response.headers.get("Content-Type") || "";
  if (!response.ok) {
    const details = kind.includes("application/json") ? await response.json().catch(() => null) : null;
    throw new Error(details?.error || `Room request failed (HTTP ${response.status}).`);
  }
  if (path === "/state" && !kind.includes("application/json")) {
    throw new Error("The room server returned a web page. Refresh using your private room link.");
  }
  if (path.startsWith("/audio/") && !kind.startsWith("audio/")) {
    throw new Error("This audio clip is unavailable.");
  }
  return response;
}

function controls() {
  talk.disabled = !mic || !state || state.ended || playing || pending ||
    (recorder?.state !== "recording" && (state.busy || (state.takeover && state.role === "receiver")));
}

async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    state = await (await request("/state")).json();
    el("role").textContent = state.role === "caller" ? "Caller" : "Receiver";
    el("end").hidden = state.role !== "receiver" || state.ended;
    el("turns").replaceChildren(...state.turns.map(({speaker, text}) => {
      const line = document.createElement("li");
      line.textContent = speaker + ": " + text;
      return line;
    }));
    if (state.ended) {
      mic?.getTracks().forEach(track => track.stop());
      el("join").disabled = true;
      el("draft").hidden = false;
      el("report").textContent = state.report;
    }
    if (mic && !playing && !pending && recorder?.state !== "recording") {
      const turn = state.turns.find(t => t.id > lastPlayed && t.speaker !== state.role);
      if (turn) {
        playing = true;
        controls();
        try {
          const clip = await (await request("/audio/" + turn.id)).blob();
          const url = URL.createObjectURL(clip);
          if (player.src.startsWith("blob:")) URL.revokeObjectURL(player.src);
          player.src = url;
          player.hidden = false;
          lastPlayed = turn.id;
          player.onended = player.onerror = () => { playing = false; controls(); };
          await player.play().catch(() => {
            el("status").textContent = "Tap Play to hear the latest turn.";
          });
        } catch (error) {
          if (turn.speaker === "assistant" && window.speechSynthesis) {
            const utterance = new SpeechSynthesisUtterance(turn.text);
            utterance.onend = utterance.onerror = () => { playing = false; controls(); };
            lastPlayed = turn.id;
            window.speechSynthesis.speak(utterance);
          } else {
            playing = false;
            throw error;
          }
        }
      }
    }
    controls();
  } finally {
    refreshing = false;
  }
}

el("join").onclick = async () => {
  el("join").disabled = true;
  try {
    mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true}});
    el("status").textContent = "Record a turn, then tap Send turn.";
    controls();
  } catch (error) {
    el("status").textContent = error.message;
    el("join").disabled = false;
  }
};

talk.onclick = () => {
  if (recorder?.state === "recording") {
    recorder.stop();
    return;
  }
  try {
    recorder = new MediaRecorder(mic);
    const chunks = [];
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onstop = async () => {
      clearTimeout(timer);
      talk.textContent = "Record turn";
      pending = true;
      controls();
      try {
        await request("/turn", {method: "POST", body: new Blob(chunks, {type: recorder.mimeType})});
        el("status").textContent = "Turn sent.";
      } catch (error) {
        el("status").textContent = error.message;
      } finally {
        pending = false;
        controls();
      }
    };
    recorder.start();
    talk.textContent = "Send turn";
    timer = setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, 15000);
  } catch (error) {
    el("status").textContent = error.message;
  }
};

el("end").onclick = () => request("/end", {method: "POST"}).then(refresh).catch(showError);
el("save").onclick = () => {
  const text = state.turns.map(t => `${t.id}. ${t.speaker}: ${t.text}`).join("\n");
  const url = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = "scamsquash-transcript.txt";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
function showError(error) { el("status").textContent = error.message; }
refresh().catch(showError);
setInterval(() => refresh().catch(showError), 750);
</script>
</html>
